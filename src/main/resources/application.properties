spring.application.name=covoiturage

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/covoiturage}
spring.datasource.username=${DB_USERNAME:covoiturage}
spring.datasource.password=${DB_PASSWORD:covoiturage}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080